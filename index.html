<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RapKonserwa FM - Debug</title>
    <style>
        body {
            background: #0a0a0a;
            color: #0f0;
            font-family: 'Courier New', monospace;
            padding: 2rem;
            max-width: 800px;
            margin: 0 auto;
        }
        pre {
            background: #111;
            padding: 1rem;
            border: 1px solid #333;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>🔍 Debug RapKonserwa</h1>
    <p>Szukam Twoich uploadów...</p>
    <pre id="output"></pre>

    <script>
        async function debug() {
            const output = document.getElementById('output');
            
            // Spróbuj różnych query
            const queries = [
                'creator:"arek_szewczyk" mediatype:audio',
                'uploader:arek_szewczyk mediatype:audio',
                'creator:arek_szewczyk',
                'RapKonserwa'
            ];

            for (const query of queries) {
                output.textContent += `\n\n=== QUERY: ${query} ===\n`;
                try {
                    const res = await fetch(
                        `https://archive.org/advancedsearch.php?q=${encodeURIComponent(query)}&output=json&rows=10&fl=identifier,title,duration,creator,uploader`
                    );
                    const data = await res.json();
                    
                    output.textContent += `Znaleziono: ${data.response.numFound} wyników\n\n`;
                    
                    data.response.docs.forEach(doc => {
                        output.textContent += `ID: ${doc.identifier}\n`;
                        output.textContent += `Title: ${doc.title || 'brak'}\n`;
                        output.textContent += `Duration: ${doc.duration || 'brak'}\n`;
                        output.textContent += `Creator: ${doc.creator || 'brak'}\n`;
                        output.textContent += `Uploader: ${doc.uploader || 'brak'}\n`;
                        output.textContent += `---\n`;
                    });
                } catch (err) {
                    output.textContent += `Błąd: ${err.message}\n`;
                }
            }
        }

        debug();
    </script>
</body>
</html>
